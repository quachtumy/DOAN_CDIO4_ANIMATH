<!doctype html>

<html class="light" lang="vi">
	<head>
		<meta charset="utf-8" />
		<meta content="width=device-width, initial-scale=1.0" name="viewport" />
		<title>Đăng ký - Animath</title>
		<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
			rel="stylesheet"
		/>
		<script id="tailwind-config">
			tailwind.config = {
				darkMode: 'class',
				theme: {
					extend: {
						colors: {
							'surface-container-high': '#e3e7ff',
							'tertiary-fixed': '#ffdbcf',
							'primary-fixed-dim': '#b8c3ff',
							'on-secondary-fixed-variant': '#00513c',
							'tertiary-fixed-dim': '#ffb59b',
							'on-tertiary-fixed-variant': '#812900',
							'on-secondary-container': '#007055',
							'primary-container': '#2d5bff',
							'on-background': '#0b1a3d',
							'on-tertiary-container': '#ffece6',
							secondary: '#006c51',
							'on-secondary': '#ffffff',
							'surface-bright': '#faf8ff',
							outline: '#747688',
							'secondary-container': '#78f6ca',
							'inverse-primary': '#b8c3ff',
							'error-container': '#ffdad6',
							'surface-tint': '#104af0',
							'surface-container-highest': '#dbe1ff',
							primary: '#0040df',
							'surface-container-lowest': '#ffffff',
							error: '#ba1a1a',
							'on-surface': '#0b1a3d',
							'surface-container': '#eaedff',
							'secondary-fixed': '#7bf9cd',
							'on-tertiary': '#ffffff',
							'inverse-surface': '#222f53',
							'surface-variant': '#dbe1ff',
							'primary-fixed': '#dde1ff',
							'on-error': '#ffffff',
							'on-tertiary-fixed': '#380d00',
							'secondary-fixed-dim': '#5cdcb1',
							tertiary: '#993100',
							'on-secondary-fixed': '#002116',
							background: '#fdf9f0',
							'on-primary-container': '#efefff',
							'on-primary': '#ffffff',
							'inverse-on-surface': '#eef0ff',
							'tertiary-container': '#c24100',
							'surface-dim': '#cfd9ff',
							'surface-container-low': '#f2f3ff',
							'on-primary-fixed': '#001355',
							'on-error-container': '#93000a',
							surface: '#faf8ff',
							'on-primary-fixed-variant': '#0035bd',
							'on-surface-variant': '#434656',
							'outline-variant': '#c4c5d9',
						},
						borderRadius: {
							DEFAULT: '0.25rem',
							lg: '0.5rem',
							xl: '0.75rem',
							full: '9999px',
						},
						spacing: {
							'container-padding-desktop': '40px',
							'stack-md': '16px',
							'container-padding-mobile': '20px',
							'stack-sm': '8px',
							unit: '8px',
							gutter: '16px',
							'stack-lg': '32px',
						},
						fontFamily: {
							'headline-md': ['Inter'],
							'headline-lg-mobile': ['Inter'],
							'display-lg': ['Inter'],
							'headline-lg': ['Inter'],
							'label-md': ['Inter'],
							caption: ['Inter'],
							'body-md': ['Inter'],
							'body-lg': ['Inter'],
						},
						fontSize: {
							'headline-md': [
								'24px',
								{ lineHeight: '32px', fontWeight: '600' },
							],
							'headline-lg-mobile': [
								'28px',
								{ lineHeight: '36px', fontWeight: '700' },
							],
							'display-lg': [
								'48px',
								{
									lineHeight: '56px',
									letterSpacing: '-0.02em',
									fontWeight: '700',
								},
							],
							'headline-lg': [
								'32px',
								{
									lineHeight: '40px',
									letterSpacing: '-0.01em',
									fontWeight: '700',
								},
							],
							'label-md': [
								'14px',
								{
									lineHeight: '20px',
									letterSpacing: '0.01em',
									fontWeight: '600',
								},
							],
							caption: [
								'12px',
								{ lineHeight: '16px', fontWeight: '500' },
							],
							'body-md': [
								'16px',
								{ lineHeight: '24px', fontWeight: '400' },
							],
							'body-lg': [
								'18px',
								{ lineHeight: '28px', fontWeight: '400' },
							],
						},
					},
				},
			};
		</script>
		<style>
			body {
				background-color: #fdf9f0;
				color: #0b1a3d;
				font-family: 'Inter', sans-serif;
			}
			.material-symbols-outlined {
				font-variation-settings:
					'FILL' 0,
					'wght' 400,
					'GRAD' 0,
					'opsz' 24;
			}
			.glass-card {
				background: rgba(255, 255, 255, 0.8);
				backdrop-filter: blur(12px);
				border: 1px solid rgba(13, 27, 62, 0.08);
				box-shadow: 0px 4px 12px rgba(13, 27, 62, 0.05);
			}
			.input-focus-ring:focus {
				outline: none;
				border-color: #2d5bff;
				box-shadow: 0 0 0 2px rgba(45, 91, 255, 0.1);
			}
			/* Custom floating animation for background elements */
			@keyframes float {
				0% {
					transform: translateY(0px) rotate(0deg);
				}
				50% {
					transform: translateY(-20px) rotate(5deg);
				}
				100% {
					transform: translateY(0px) rotate(0deg);
				}
			}
			.animate-float {
				animation: float 6s ease-in-out infinite;
			}
		</style>
	</head>
	<body class="min-h-screen flex flex-col">
		<main
			class="flex-grow flex items-center justify-center pt-20 pb-12 px-container-padding-mobile"
		>
			<div class="w-full max-w-[480px]">
				<div class="glass-card rounded-xl p-8 md:p-10">
					<div class="text-center mb-stack-lg">
						<h1
							class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-background mb-2"
						>
							Tạo tài khoản Animath
						</h1>
						<p
							class="font-body-md text-body-md text-on-surface-variant"
						>
							Bắt đầu hành trình chinh phục toán học
						</p>
					</div>
					<!-- Social Sign Up -->
					<button
						id="google-signup-btn"
						class="w-full flex items-center justify-center gap-3 bg-surface-container-lowest border border-outline-variant/30 py-3.5 px-6 rounded-lg font-label-md text-label-md text-on-surface hover:bg-surface-container transition-all duration-200 active:scale-[0.98] mb-stack-md"
					>
						<svg class="w-5 h-5" viewbox="0 0 24 24">
							<path
								d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
								fill="#4285F4"
							></path>
							<path
								d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-1 .67-2.28 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
								fill="#34A853"
							></path>
							<path
								d="M5.84 14.09c-.22-.67-.35-1.39-.35-2.09s.13-1.42.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
								fill="#FBBC05"
							></path>
							<path
								d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z"
								fill="#EA4335"
							></path>
						</svg>
						Đăng ký với Google
					</button>
					<div class="relative flex items-center py-4 mb-stack-md">
						<div
							class="flex-grow border-t border-outline-variant/30"
						></div>
						<span
							class="flex-shrink mx-4 font-caption text-caption text-outline uppercase tracking-wider"
							>Hoặc sử dụng email</span
						>
						<div
							class="flex-grow border-t border-outline-variant/30"
						></div>
					</div>
					<!-- Registration Form -->
					<form
						class="space-y-stack-md"
						onsubmit="event.preventDefault()"
					>
						<div class="space-y-2">
							<label
								class="font-label-md text-label-md text-on-surface-variant block"
								for="username"
								>Tên người dùng</label
							>
							<div class="relative group">
								<span
									class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors"
									>person</span
								>
								<input
									class="w-full bg-surface-container-lowest border border-outline-variant/40 rounded-lg py-3.5 pl-11 pr-4 font-body-md text-body-md text-on-surface input-focus-ring transition-all placeholder:text-outline/60"
									id="username"
									placeholder="Nhập tên của bạn"
									type="text"
								/>
							</div>
						</div>
						<div class="space-y-2">
							<label
								class="font-label-md text-label-md text-on-surface-variant block"
								for="email"
								>Email</label
							>
							<div class="relative group">
								<span
									class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors"
									>mail</span
								>
								<input
									class="w-full bg-surface-container-lowest border border-outline-variant/40 rounded-lg py-3.5 pl-11 pr-4 font-body-md text-body-md text-on-surface input-focus-ring transition-all placeholder:text-outline/60"
									id="email"
									placeholder="example@email.com"
									type="email"
								/>
							</div>
						</div>
						<div class="space-y-2">
							<label
								class="font-label-md text-label-md text-on-surface-variant block"
								for="password"
								>Mật khẩu</label
							>
							<div class="relative group">
								<span
									class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors"
									>lock</span
								>
								<input
									class="w-full bg-surface-container-lowest border border-outline-variant/40 rounded-lg py-3.5 pl-11 pr-12 font-body-md text-body-md text-on-surface input-focus-ring transition-all placeholder:text-outline/60"
									id="password"
									placeholder="Tối thiểu 8 ký tự"
									type="password"
								/>
								<button
									class="absolute right-3.5 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface-variant"
									type="button"
								>
									<span class="material-symbols-outlined"
										>visibility</span
									>
								</button>
							</div>
						</div>
						<div class="pt-2">
							<button
								id="register-btn"
								class="w-full bg-primary hover:bg-primary/90 text-on-primary font-label-md text-label-md py-4 rounded-lg shadow-sm hover:shadow-md transition-all duration-200 active:scale-[0.98] flex items-center justify-center gap-2"
							>
								Bắt đầu ngay
								<span
									class="material-symbols-outlined text-base"
									>arrow_forward</span
								>
							</button>
						</div>
					</form>
					<div
						class="mt-stack-lg text-center border-t border-outline-variant/20 pt-6"
					>
						<p
							class="font-body-md text-body-md text-on-surface-variant"
						>
							Đã có tài khoản?
							<a
								class="text-primary font-bold hover:underline ml-1"
								href="login.html"
							>
								Đăng nhập
							</a>
						</p>
					</div>
				</div>
				<!-- Footer Small Terms -->
				<p
					class="text-center mt-8 font-caption text-caption text-outline px-4"
				>
					Bằng cách đăng ký, bạn đồng ý với Điều khoản dịch vụ và
					Chính sách bảo mật của Animath.
				</p>
			</div>
		</main>
		<script type="module">
			import { supabase } from './supabase.js';

			// Google Signup
			document
				.getElementById('google-signup-btn')
				.addEventListener('click', async () => {
					const { error } = await supabase.auth.signInWithOAuth({
						provider: 'google',
						options: {
							redirectTo: 'http://127.0.0.1:5500/assistant.html',
						},
					});

					if (error) {
						alert(error.message);
					}
				});

			// Email Signup
			document
				.getElementById('register-btn')
				.addEventListener('click', async (e) => {
					e.preventDefault();

					const username = document.getElementById('username').value;

					const email = document.getElementById('email').value;

					const password = document.getElementById('password').value;

					if (!username || !email || !password) {
						alert('Vui lòng nhập đầy đủ thông tin');
						return;
					}

					const { data, error } = await supabase.auth.signUp({
						email,
						password,
						options: {
							data: {
								full_name: username,
							},
						},
					});

					if (error) {
						alert(error.message);
						return;
					}

					window.location.href = 'login.html';
				});

			// Password toggle
			document
				.querySelectorAll('button[type="button"]')
				.forEach((btn) => {
					btn.addEventListener('click', function () {
						const input = this.previousElementSibling;
						const icon = this.querySelector('span');

						if (input.type === 'password') {
							input.type = 'text';
							icon.textContent = 'visibility_off';
						} else {
							input.type = 'password';
							icon.textContent = 'visibility';
						}
					});
				});

			// Input focus animation
			const inputs = document.querySelectorAll('input');

			inputs.forEach((input) => {
				input.addEventListener('focus', () => {
					input.parentElement.classList.add(
						'ring-2',
						'ring-primary-container/20',
					);
				});

				input.addEventListener('blur', () => {
					input.parentElement.classList.remove(
						'ring-2',
						'ring-primary-container/20',
					);
				});
			});
		</script>
	</body>
</html>
